name = "rasalytics-api"
main = "worker.ts"
compatibility_date = "2026-06-24"

# The Cache API only works on a custom domain, not on workers.dev.
routes = [{ pattern = "api-rasalytics.belajarcarabelajar.com", custom_domain = true }]
# Wrangler turns workers.dev off once routes exist; old clients still call it.
workers_dev = true

# The Worker environment variables.
# For production secrets, use `wrangler secret put <NAME>` instead.
[vars]
ENVIRONMENT = "production"

[observability]
enabled = true

# Per-client-IP limit for POST /api/analyze-video. Counts are kept per Cloudflare
# location, not globally. period must be 10 or 60 and must match
# RATE_LIMIT_PERIOD_SECONDS in worker.ts (sent as Retry-After).
[[ratelimits]]
name = "ANALYZE_RATE_LIMITER"
# Must be unique in the Cloudflare account; 71001 and 71002 belong to time-capsule.
namespace_id = "81001"

  [ratelimits.simple]
  limit = 10
  period = 60
